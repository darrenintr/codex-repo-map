[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-repo-map"
version = "0.1.0"
description = "Token-efficient local codebase structure maps for AI coding routers and agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Darren"}]
keywords = ["codex", "ai", "codebase", "index", "router", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
codex-repo-map = "codex_repo_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
